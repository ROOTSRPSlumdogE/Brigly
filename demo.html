<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F4EF">
  <meta name="robots" content="noindex">
  <meta name="description" content="Explore Brigly's connected restaurant workspace with interactive Team Member and Manager views.">
  <title>The Copper Room — Brigly Workspace</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/plus-jakarta-sans.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="assets/css/demo.css">
  <script src="assets/js/demo.js" defer></script>
</head>
<body data-role-mode="employee">
  <a class="skip-link" href="#demo-main">Skip to workspace</a>

  <div class="app-frame">
    <aside class="app-sidebar" id="app-sidebar" aria-label="Workspace sidebar">
      <div class="sidebar-top-row">
        <a href="index.html" class="app-brand" aria-label="Brigly homepage">
          <img src="assets/logos/brigly-on-light.svg" alt="Brigly" width="118" height="32">
        </a>
        <button class="sidebar-close" type="button" aria-label="Close navigation">×</button>
      </div>

      <div class="workspace-switch">
        <div class="workspace-avatar">C</div>
        <div class="workspace-meta">
          <strong>The Copper Room</strong>
          <small id="venue-sublabel">Fri, Oct 23 · 16:00 Service</small>
        </div>
        <span class="workspace-dot" title="Active shift"></span>
      </div>

      <div class="nav-group-label" id="nav-group-primary">MY SHIFT WORKSPACE</div>
      <nav class="app-nav" id="app-nav" aria-label="Workspace navigation">
        <button type="button" data-view="dashboard" class="selected" style="order:1">
          <span class="nav-glyph">⌂</span>
          <span class="nav-label" id="nav-label-dashboard">My Shift Today</span>
        </button>
        <button type="button" data-view="inbox" style="order:9">
          <span class="nav-glyph">▱</span>
          <span class="nav-label" id="nav-label-inbox">Review Inbox</span>
          <span class="nav-count" id="nav-review-count">2</span>
        </button>
        <button type="button" data-view="briefings" style="order:2">
          <span class="nav-glyph">◈</span>
          <span class="nav-label" id="nav-label-briefings">Shift Briefing</span>
          <span class="nav-count" id="nav-brief-count">1</span>
        </button>
        <button type="button" data-view="checklists" style="order:3">
          <span class="nav-glyph">☑</span>
          <span class="nav-label" id="nav-label-checklists">Daily Tasks</span>
          <span class="nav-count" id="nav-task-count">4</span>
        </button>
        <button type="button" data-view="shifts" style="order:4">
          <span class="nav-glyph">▦</span>
          <span class="nav-label" id="nav-label-shifts">Schedule</span>
        </button>
        <button type="button" data-view="chat" style="order:5">
          <span class="nav-glyph">◉</span>
          <span class="nav-label" id="nav-label-chat">Team Chat</span>
        </button>
        <span class="nav-group-label nav-group-second" id="nav-group-secondary" style="order:6">OPERATIONS &amp; REFERENCE</span>
        <button type="button" data-view="knowledge" style="order:7">
          <span class="nav-glyph">▤</span>
          <span class="nav-label" id="nav-label-knowledge">Knowledge</span>
          <span class="nav-count" id="nav-know-count" hidden>1</span>
        </button>
        <button type="button" data-view="supply" style="order:8">
          <span class="nav-glyph">▣</span>
          <span class="nav-label" id="nav-label-supply">Supply Requests</span>
        </button>
        <button type="button" data-view="academy" style="order:10">
          <span class="nav-glyph">◇</span>
          <span class="nav-label" id="nav-label-academy">Academy</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="sidebar-avatar" id="sidebar-avatar">AL</div>
        <div class="sidebar-user-meta">
          <strong id="profile-name">Alex Morgan</strong>
          <small id="sidebar-role">Server · 16:00–23:00</small>
        </div>
        <button id="reset-demo" type="button" class="icon-button" aria-label="Reset demo" title="Reset sample data">↺</button>
      </div>
    </aside>

    <button class="sidebar-scrim" type="button" aria-label="Close navigation" hidden></button>

    <div class="app-right">
      <header class="app-topbar">
        <button type="button" class="mobile-sidebar-toggle" aria-label="Open navigation" id="sidebar-toggle" aria-expanded="false" aria-controls="app-sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h11"/></svg>
        </button>

        <div class="app-breadcrumb">
          <span class="crumb-venue">The Copper Room</span>
          <span class="crumb-sep">/</span>
          <span class="crumb-role" id="breadcrumb-role">Team</span>
          <span class="crumb-sep">/</span>
          <b id="breadcrumb-current">Overview</b>
        </div>

        <div class="app-top-actions">
          <button type="button" class="command-trigger" data-command="search" aria-label="Search workspace">
            <span class="search-icon">⌕</span>
            <span class="search-label">Search…</span>
            <kbd>⌘K</kbd>
          </button>

          <div class="role-switch" role="group" aria-label="Switch workspace role">
            <button type="button" data-role="employee" class="active" aria-pressed="true">
              <span class="role-dot employee-dot"></span>
              <span>Team<span class="hide-xs"> · Alex</span></span>
            </button>
            <button type="button" data-role="manager" aria-pressed="false">
              <span class="role-dot manager-dot"></span>
              <span>Manager<span class="hide-xs"> · Jamie</span></span>
              <b class="role-badge" id="top-manager-badge">2</b>
            </button>
          </div>
        </div>
      </header>

      <main id="demo-main" tabindex="-1">
        <noscript>
          <p class="callout">Enable JavaScript to explore the interactive Brigly workspace, or <a href="index.html">return to the website</a>.</p>
        </noscript>
        <div id="app-content"></div>
      </main>

      <footer class="workspace-footer">
        <span><i></i> The Copper Room · Connected Shift Workspace</span>
        <div class="workspace-footer-links">
          <a href="index.html">← Back to Brigly.com</a>
          <span>·</span>
          <button type="button" class="footer-reset-link" data-command="reset">Reset workspace</button>
        </div>
      </footer>
    </div>
  </div>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile workspace navigation">
    <button type="button" data-quick="dashboard" class="active">
      <span class="bnav-icon">⌂</span>
      <small id="bnav-label-dashboard">Today</small>
    </button>
    <button type="button" data-quick="briefings">
      <span class="bnav-icon">◈</span>
      <small>Briefing</small>
      <b class="bnav-badge" id="bnav-brief-badge">1</b>
    </button>
    <button type="button" data-quick="checklists" id="bnav-primary-mid">
      <span class="bnav-icon" id="bnav-mid-icon">☑</span>
      <small id="bnav-mid-label">Tasks</small>
      <b class="bnav-badge" id="bnav-mid-badge">4</b>
    </button>
    <button type="button" data-quick="inbox" id="bnav-inbox-btn">
      <span class="bnav-icon">▱</span>
      <small id="bnav-inbox-label">Status</small>
      <b class="bnav-badge bnav-orange" id="bnav-inbox-badge">2</b>
    </button>
    <button type="button" data-command="search">
      <span class="bnav-icon">⌕</span>
      <small>Jump</small>
    </button>
  </nav>

  <div id="app-toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="workspace-dialog" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title">Explore Brigly</h2>
      <button type="button" class="dialog-close" aria-label="Close dialog">×</button>
    </div>
    <div id="dialog-body"></div>
  </dialog>
</body>
</html>
